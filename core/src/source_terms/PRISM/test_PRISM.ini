[run]
tEnd=100
nStepmax=2
nOutput=1
initial_conditions=uniform
output_frequency=1
passive_scalars_names=nH,nHe,xH_I,xH_II,xH2,xHe_I,xHe_II,xHe_III
passive_scalars_init=uniform,uniform,uniform,uniform,uniform,uniform,uniform,uniform

[InitialConditions_uniform]
fields=rho,e_tot,rho_vx,rho_vy,rho_vz,e_rad,fx_rad,fy_rad,fz_rad
values=1e0,1e0,0,0,0,0,0,0,0

[dt]
dt_kernel=Compute_dt_hydro,Compute_dt_rad

[passive_scalars]
nH_rho0=0.76
nHe_rho0=0.0599610253335332
xH_I_rho0=0
xH_II_rho0=1
xH2_rho0=0
xHe_I_rho0=0
xHe_II_rho0=0
xHe_III_rho0=1

[source_terms]
updates = CoolingUpdate_PRISM_hydro

[cooling]
data_path=/home/cphyc/Documents/prog/dyablo/core/src/source_terms/PRISM/gizmo_rtz/data/
ions=H_I,H_II,H2,He_I,He_II,He_III

[amr]
level_min=0
level_max=0

bx=1
by=1
bz=1

nbOctsPerGroup=2048
loadbalance_coherent_levels=2

markers_kernel=RefineCondition_pseudo_gradient
epsilon_refine=0.1
epsilon_coarsen=0.05

load_balancing_frequency=50
cycle_frequency=10

[mesh]
ndim=3

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

zmin=0.0
zmax=1.0

boundary_type_xmin=periodic
boundary_type_xmax=periodic

boundary_type_ymin=periodic
boundary_type_ymax=periodic

boundary_type_zmin=periodic
boundary_type_zmax=periodic

[hydro]
gamma0=1.666
riemann=hllc

[rad]
update=RadUpdate_euler_M1
c_rad=0.01 speedofLight

[output]
outputDir=./
outputPrefix=test_blast_3D_block
write_variables=rho,rho_vx,rho_vy,rho_vz,e_tot,xH_I,xH_II,xHe_I,xHe_II,xHe_III

[units]
time = 10 Myr
length = 100 pc
density = 1 proton_mass/cm3
