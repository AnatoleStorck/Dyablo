[run]
tEnd=0.05
nStepmax=1000
nOutput=1
initial_conditions=blast

passive_scalars_names=nH,nHe,xH_I,xH_II,xHe_I,xHe_II,xHe_III
passive_scalars_init=uniform,uniform,uniform,uniform,uniform,uniform,uniform

[passive_scalars]
nH_rho0=0.76
nHe_rho0=0.24
xH_I_rho0=0
xH_II_rho0=1
xHe_I_rho0=0
xHe_II_rho0=0
xHe_III_rho0=1

[source_terms]
updates = CoolingUpdate_PRISM_hydro

[cooling]
data_path=/home/cphyc/Documents/prog/dyablo/core/src/source_terms/PRISM/gizmo_rtz/
ions=H_I,H_II,He_I,He_II,He_III

[amr]
level_min=2
level_max=4

bx=4
by=4
bz=4

nbOctsPerGroup=2048
loadbalance_coherent_levels=2

markers_kernel=RefineCondition_pseudo_gradient
epsilon_refine=0.1
epsilon_coarsen=0.05

load_balancing_frequency=50
cycle_frequency=10

[mesh]
ndim=3

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

zmin=0.0
zmax=1.0

boundary_type_xmin=periodic
boundary_type_xmax=periodic

boundary_type_ymin=periodic
boundary_type_ymax=periodic

boundary_type_zmin=periodic
boundary_type_zmax=periodic

[hydro]
gamma0=1.666
riemann=hllc

[blast]
density_in=1.0
density_out=1.2
radius=0.25

[output]
outputDir=./
outputPrefix=test_blast_3D_block
write_variables=rho,rho_vx,rho_vy,rho_vz,e_tot

[units]
time = 10 Myr
length = 100 pc
density = 1 proton_mass/cm3
