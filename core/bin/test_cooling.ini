[ini]
convert_units      = true

[run]
tEnd=10
output_timeslice=0.05
nStepmax=10000

initial_conditions=uniform

[source_terms]
updates = SourceUpdate_cooling_grackle_table

[cooling]
grackle_table = /home/cphyc/Documents/prog/grackle_data_files/input/CloudyData_UVB=HM2012_high_density.h5

[dt]
hydro_cfl=0.8

[amr]
level_min=1
level_max=1

bx=3
by=3
bz=3

[mesh]
ndim=3

[hydro]
gamma0  = 1.666
riemann = hllc
update  = HydroUpdate_euler

[InitialConditions_uniform]
fields=rho,e_tot,rho_vx,rho_vy,rho_vz
values=.2,25,0,0,0

[output]
outputDir=./
outputPrefix=cooling
write_variables=rho,rho_vx,rho_vy,rho_vz,e_tot
output_real_type=double

[units]
time = 10 Myr
length = 100 pc
density = 1 proton_mass/cm3
