[run]
tEnd=11.0
nStepmax=1000000
output_timeslice=0.1

initial_conditions=kelvin_helmholtz

passive_scalars_names=uniform_dye,KH_dye
passive_scalars_init=uniform,kelvin_helmholtz

[passive_scalars]
uniform_dye_rho0=1.0

[dt]
dt_kernels=Compute_dt_hydro
hydro_cfl=0.8

[amr]
level_min=3
level_max=6

coarse_oct_resolution_x=8
coarse_oct_resolution_y=4

bx=4
by=4

load_balancing_frequency=500
cycle_frequency=1

markers_kernel=RefineCondition_pseudo_gradient
epsilon_coarsen=0.025
epsilon_refine=0.075

nboctspergroup=2048

remap=MapUserData_linear

[mesh]
ndim=2

xmin=0.0
xmax=4.0

ymin=0.0
ymax=2.0

boundary_type_xmin=periodic
boundary_type_xmax=periodic

boundary_type_ymin=absorbing
boundary_type_ymax=absorbing

[hydro]
gamma0=1.6666667
problem=kelvin_helmholtz
riemann=hllc
update=HydroUpdate_euler_2_passive_scalars
slope_enabled=false

[KH]
rho_fac=1.0
z1=0.5
z2=1.5
a=0.05
Amp=0.01
sigma=0.2
P0=10.0
uflow=1.0

[output]
outputDir=./
outputPrefix=KH_2D_block
write_variables=rho,rho_vx,rho_vy,e_tot,uniform_dye,KH_dye