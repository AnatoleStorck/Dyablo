[ini]
convert_units  = true

[amr]
bx=4
by=4
bz=4
level_min=2
level_max=2
markers_kernel=RefineCondition_pseudo_gradient
nbOctsPerGroup=1024
use_block_data=yes
loadbalance_coherent_levels = 3
enable_load_balance_during_init=false
epsilon_refine= 0.6
epsilon_coarsen= 0.4
error_min=0.2
error_max=0.8

[hydro]
gamma0               = 1.666        
niter_riemann        = 10
iorder               = 2
slope_type           = 2       
riemann              = hllc                
smallp               = 1e-18
smallr               = 1e-25
update               = HydroUpdate_euler
slope_enabled        = true

[dt]
dt_kernel            = Compute_dt_rad
dt                   = 1.0e-4
particle_cfl         = 0.8
hydro_cfl            = 0.9

[mesh]
boundary_type_xmax   = reflecting          
boundary_type_xmin   = reflecting          
boundary_type_ymax   = reflecting            
boundary_type_ymin   = reflecting            
boundary_type_zmax   = reflecting            
boundary_type_zmin   = reflecting            
ndim                 = 3                   
xmin                 = 0.0      
xmax                 = 13.2
ymin                 = 0.0               
ymax                 = 13.2            
zmin                 = 0.0     
zmax                 = 13.2

[run]               
enable_output        = true                
initial_conditions   = stromgren
nstepmax             = 100000
output_frequency     = 100
nlog                 = 100
tend                 = 500

[source_terms]
updates              = SourceUpdate_Photons_Stromgren,SourceUpdate_Ionization_Stromgren

[rad]
update               = RadUpdate_euler_M1
temp_black_body      = 50000 K
temperature          = 1e4 K
small_erad           = 1e-10 
c_rad                = 0.001 speedoflight


[stromgren]
spawn_rate           = 5e48 s-1
source_position      = 6.6 kpc

[InitialConditions_stromgren]
gas_density          = 1000.0 proton_mass/m3
xe_start             = 1.2e-3

[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false
hdf5_enabled         = yes
output_real_type     = double               
outputdir            = ./       
outputprefix         = stromgren
outputVtkAscii       = true
outputVtkBinary      = true
outputVtkAppended    = true
vtk_enabled          = yes
write_mesh_info      = yes
write_variables      = rho,rho_HII

[units]
time = 1 Myr
length = 1 kpc
density = 1 proton_mass/m3
particle_density = 1 atom/m3