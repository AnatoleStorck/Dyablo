[ini]
convert_units      = true

[amr]
bx                   = 8                   
by                   = 4                   
bz                   = 4                   
level_min            = 3 
level_max            = 3
markers_kernel       = RefineCondition_mass
nboctspergroup       = 1024                  
use_block_data       = true
loadbalance_coherent_levels = 3
enable_load_balance_during_init = false

[hydro]
gamma0               = 1.66666666666666666666        
niter_riemann        = 10
iorder               = 2
slope_type           = 2       
riemann              = hllc                
smallp               = 1e-50         
smallr               = 1e-50         
slope_enabled        = false
update               = HydroUpdate_euler

[cosmology]
active               = true
da                   = 1.05
mass_coarsen_factor  = 0.9               
mass_refine_factor   = 16 
lookup_size          = 2048
omegab               = 0.049
save_expansion_table = false
n_tiles              = 2,1,1
H0 = 70 km/s/Mpc

[dt]
dt_kernel            = Compute_dt_cosmology,Compute_dt_hydro,Compute_dt_particle_velocity
dt                   = 1.0e-4
particle_cfl         = 0.8
hydro_cfl            = 0.8

[gravity]
solver               = GravitySolver_cg
4_Pi_G               = 1000
CG_eps               = 1e-3
print_cg_iter        = false

[particles]
update_position      = ParticleUpdate_CIC_move
update_density       = ParticleUpdate_CIC_density

[grafic]
inputDir=./zeldo_5

[mesh]
boundary_type_xmax   = periodic          
boundary_type_xmin   = periodic          
boundary_type_ymax   = periodic            
boundary_type_ymin   = periodic            
boundary_type_zmax   = periodic            
boundary_type_zmin   = periodic            
ndim                 = 3                   
xmin                 = 0.0      
xmax                 = 20.0             
ymin                 = 0.0                 
ymax                 = 10.0  
zmin                 = 0.0     
zmax                 = 10.0

[run]               
enable_output        = true                
initial_conditions   = grafic_fields,particle_grid
nstepmax             = 10
output_frequency     = 10000             
nlog                 = 100
t_end_var            = aexp
tend                 = 0.16

[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false
hdf5_enabled         = yes
output_real_type     = double               
outputdir            = ./              
outputprefix         = tiling
outputVtkAscii       = true
outputVtkBinary      = true
outputVtkAppended    = true
vtk_enabled          = yes
write_mesh_info      = yes
write_variables      = rho
write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass

[units]
time = 1Gyr
length = 1 Mpc
density = 1 proton_mass / m3
