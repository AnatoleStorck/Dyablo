[ini]
convert_units  = true

[amr]
bx=4
by=4
bz=4
level_min=3
level_max=3
markers_kernel=RefineCondition_pseudo_gradient
nbOctsPerGroup=1024
use_block_data=yes
loadbalance_coherent_levels = 3
enable_load_balance_during_init=false
epsilon_refine= 0.6
epsilon_coarsen= 0.4
error_min=0.2
error_max=0.8

[hydro]
gamma0               = 1.666        
niter_riemann        = 10
iorder               = 2
slope_type           = 2       
riemann              = hllc                
smallp               = 1e-18
smallr               = 1e-25
update               = HydroUpdate_euler
slope_enabled        = true

[dt]
dt_kernel            = Compute_dt_rad
dt                   = 1.0e-4
particle_cfl         = 0.8
hydro_cfl            = 0.9

[mesh]
boundary_type_xmax   = absorbing          
boundary_type_xmin   = absorbing          
boundary_type_ymax   = absorbing            
boundary_type_ymin   = absorbing            
boundary_type_zmax   = absorbing            
boundary_type_zmin   = absorbing            
ndim                 = 3                   
xmin                 = 0.0      
xmax                 = 8.0
ymin                 = 0.0               
ymax                 = 8.0        
zmin                 = 0.0     
zmax                 = 8.0

[run]               
enable_output        = true                
initial_conditions   = stromgren
nstepmax             = 10000
output_frequency     = 100
nlog                 = 200
t_end_var            = aexp
tend                 = 0.06298

[source_terms]
updates              = SourceUpdate_Photons_Stromgren,SourceUpdate_Ionization_Stromgren

[rad]
update               = RadUpdate_euler_M1
temp_black_body      = 50000 K
temperature          = 1e4 K
use_recombination    = false
a_stop_emission      = 0.06298
small_erad           = 1e-20
c_rad                = 0.001 speedoflight

[stromgren]
source_position      = 4.0 kpc
density_factor       = 7.5e4
n_gamma              = 1e4

[InitialConditions_stromgren]
xe_start             = 0.0

[cosmology]
active               = true
da                   = 1.005
lookup_size          = 2048
H0                   = 70.0 km/s/Mpc
omegam               = 0.3
omegav               = 0.7
omegab               = 0.049
astart               = 0.0625

[output]
backend              = IOManager_hdf5      
checkpoint           = IOManager_checkpoint
debug                = false
hdf5_enabled         = yes
output_real_type     = double               
outputdir            = ./
outputprefix         = stromgren
outputVtkAscii       = true
outputVtkBinary      = true
outputVtkAppended    = true
vtk_enabled          = yes
write_mesh_info      = yes
write_variables      = rho,rho_HII

[units]
time = 1 Myr
length = 1 kpc
density = 1 proton_mass/m3
particle_density = 1 atom/m3